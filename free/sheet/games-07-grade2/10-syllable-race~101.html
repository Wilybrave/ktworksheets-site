<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="sheet-kind" content="game">
<title>Syllable Race</title>
<style>
  @page { size: letter portrait; margin: 0.4in 0.45in; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  :root {
    --ink:    #16130F;
    --muted:  #6B635A;
    --rule:   #CFC3B2;
    --guide:  #BCAE9C;
    --accent: #C0511D;
    --tint:   #F7EDE4;
    --slate:  #2E5A78;
    --tintslate: #E9EFF4;
    --deep:   #2C4A45;
    --tintdeep: #ECF1EF;
  }

  body {
    font-family: Quicksand, 'URW Gothic', 'Century Gothic', sans-serif;
    color: #000; background: #fff;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  /* ORDER MATTERS. This generic rule must come BEFORE the @media screen block:
   * both selectors have the same specificity, so whichever is declared last
   * wins. With it after, it overrode the screen width and the preview stretched
   * to the viewport — rows scaled up and pages measured 16in tall. Print was
   * always fine (@media screen doesn't apply), but the on-screen proof lied. */
  .page { width: 100%; }
  .page + .page { page-break-before: always; }

  @media screen {
    body { padding: 0.4in; background: #ddd; }
    .page {
      background: #fff; padding: 0.4in 0.45in;
      width: 8.5in; min-height: 11in;
      margin: 0 auto 22px; box-shadow: 0 2px 10px rgba(0,0,0,.3);
    }
  }

  header {
    display: flex; align-items: center; gap: 16px;
    border-bottom: 3px solid var(--slate); padding-bottom: 7px; margin-bottom: 2px;
  }
  .bigletter { font-size: 38pt; font-weight: 700; line-height: 1; letter-spacing: .02em; }
  .htext { flex: 1; }
  h1 { font-size: 14pt; font-weight: 700; margin: 0 0 2px; }
  .sub { font-size: 10pt; color: var(--muted); margin: 0; }
  .nameline {
    font-size: 9.5pt; color: var(--muted);
    border-bottom: 1px solid var(--ink); width: 2in;
    padding-bottom: 1px; align-self: flex-end;
  }

  .label { font-size: 11.5pt; font-weight: 700; margin: 9px 0 1px; }
  .label span { font-weight: 400; font-size: 10pt; color: var(--muted); }

  .row { display: block; width: 100%; height: auto; margin-bottom: .06in; }
  /* Rows that follow the header directly would otherwise jam against its rule. */
  header + .row { margin-top: .12in; }

  .words {
    margin-top: 10px; padding-top: 7px; border-top: 1px solid var(--rule);
    font-size: 12.5pt;
    display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
  }
  .words b { font-size: 14pt; }
  .words em { font-style: normal; color: var(--muted); }

  /* The wordmark rides in the footer line that was already there — see the note
     in lib/sheet.js. No height, upright, a size down, and never louder than the
     two slots it sits between. */
  .brand { font-style: normal; font-size: 7pt; letter-spacing: .04em;
    color: var(--accent); align-self: center; }

  footer {
    margin-top: 7px; font-size: 8.5pt; color: var(--muted);
    display: flex; justify-content: space-between;
  }

  .chart { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; margin-top: 14px; }
  .cell {
    border: 2px solid var(--slate); border-radius: 8px; height: 1.35in;
    display: flex; align-items: center; justify-content: center;
  }

  .page.key { background: #fcfcfa; }
  .page.key header { border-bottom-style: double; border-bottom-width: 3px; }
  .keylist { font-size: 11pt; line-height: 1.7; }
  .keylist p { margin: .02in 0; }
  .keynote { border: 1.5px solid var(--deep); border-radius: 8px; padding: .07in .12in;
    margin: .1in 0 0; font-size: 10pt; line-height: 1.5; }

  .rules { border: 1.5px solid var(--accent); border-radius: 8px; padding: .08in .13in;
    margin: .06in 0 .12in; font-size: 10pt; }
  svg { display: block; }

  .track { display: grid; grid-template-columns: repeat(5, 1fr); }
  .tcell { border: 2px solid var(--ink); margin: -1px 0 0 -1px; height: 1.45in;
    display: flex; align-items: center; justify-content: center; }
  .tcell.start, .tcell.end { background: var(--tint); font-size: 11pt; font-weight: 700;
    letter-spacing: .06em; }

  .tilesec { margin-bottom: .1in; }
  .tiletitle { font-size: 11pt; font-weight: 700; margin-bottom: .03in; }
  .tiles { display: grid; }
  .tiles.four { grid-template-columns: repeat(4, 1fr); }
  .tiles.five { grid-template-columns: repeat(5, 1fr); }
  .tile { border: 2px dashed var(--accent); margin: -1px 0 0 -1px; height: 1.42in;
    display: flex; align-items: center; justify-content: center; }
  .tile.pre { background: #ededed; }
  .tile.suf { background: #f6f6f6; }

  .scorerow { display: flex; gap: .26in; }
  .scorecol { flex: 1; border: 2px solid var(--ink); border-radius: 9px; padding: .08in .1in; }
  .scorehead { font-size: 12pt; font-weight: 700; margin-bottom: .05in; }
  .scoreline { border-bottom: 1.4px solid var(--slate); height: .42in; }
  .scoretotal { font-size: 11pt; font-weight: 700; margin-top: .08in; }
  .scoretotal span { display: inline-block; width: .7in; border-bottom: 2px solid var(--slate); }
  .hint { border: 1.5px solid var(--slate); border-radius: 8px; padding: .07in .12in;
    margin-top: .12in; font-size: 10.5pt; }

  .callgrid { display: grid; grid-template-columns: repeat(4, 1fr); }
  .callcell { border: 1.6px dashed var(--accent); margin: -1px 0 0 -1px; height: 1.4in;
    display: flex; align-items: center; justify-content: center; }

  .boards { display: grid; grid-template-columns: 1fr 1fr; gap: .18in; }
  .board { break-inside: avoid; }
  .btitle { font-size: 11pt; font-weight: 700; margin-bottom: .03in; }
  .bgrid { display: grid; grid-template-columns: repeat(3, 1fr); }
  .bcell { border: 2px solid var(--ink); margin: -1px 0 0 -1px; height: 1.3in;
    display: flex; align-items: center; justify-content: center; }

  .deck { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: .1in; }
  .card { border: 2px dashed var(--accent); height: 1.95in; margin: -1px 0 0 -1px;
    display: flex; align-items: center; justify-content: center; }

  .keylist { border: 2px solid var(--slate); border-radius: 9px; padding: .08in .12in; }
  .krow { display: flex; align-items: center; gap: .14in;
    border-bottom: 1px solid var(--rule); padding: .3in 0; }
  .krow:last-child { border-bottom: 0; }
  .krow span { font-size: 12pt; color: var(--muted); }
</style>
</head>
<body>

  <header>
    <div class="bigletter">&#9834;</div>
    <div class="htext">
      <h1>Syllable Race</h1>
      <p class="sub">Land on a word, clap the beats, say the number.</p>
    </div>
    <div class="nameline">Name</div>
  </header>

  <div class="rules">Roll and move. Wrong count? Back one. <i>Not sure? Hand under your chin: your jaw drops once a beat.</i></div>

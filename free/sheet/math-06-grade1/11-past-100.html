<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="sheet-kind" content="worksheet">
<title>Past One Hundred</title>
<style>
  @page { size: letter portrait; margin: 0.4in 0.45in; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  :root {
    --ink:    #16130F;
    --muted:  #6B635A;
    --rule:   #CFC3B2;
    --guide:  #BCAE9C;
    --accent: #C0511D;
    --tint:   #F7EDE4;
    --slate:  #2E5A78;
    --tintslate: #E9EFF4;
    --deep:   #2C4A45;
    --tintdeep: #ECF1EF;
  }

  body {
    font-family: Quicksand, 'URW Gothic', 'Century Gothic', sans-serif;
    color: #000; background: #fff;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  /* ORDER MATTERS. This generic rule must come BEFORE the @media screen block:
   * both selectors have the same specificity, so whichever is declared last
   * wins. With it after, it overrode the screen width and the preview stretched
   * to the viewport — rows scaled up and pages measured 16in tall. Print was
   * always fine (@media screen doesn't apply), but the on-screen proof lied. */
  .page { width: 100%; }
  .page + .page { page-break-before: always; }

  @media screen {
    body { padding: 0.4in; background: #ddd; }
    .page {
      background: #fff; padding: 0.4in 0.45in;
      width: 8.5in; min-height: 11in;
      margin: 0 auto 22px; box-shadow: 0 2px 10px rgba(0,0,0,.3);
    }
  }

  header {
    display: flex; align-items: center; gap: 16px;
    border-bottom: 3px solid var(--slate); padding-bottom: 7px; margin-bottom: 2px;
  }
  .bigletter { font-size: 38pt; font-weight: 700; line-height: 1; letter-spacing: .02em; }
  .htext { flex: 1; }
  h1 { font-size: 14pt; font-weight: 700; margin: 0 0 2px; }
  .sub { font-size: 10pt; color: var(--muted); margin: 0; }
  .nameline {
    font-size: 9.5pt; color: var(--muted);
    border-bottom: 1px solid var(--ink); width: 2in;
    padding-bottom: 1px; align-self: flex-end;
  }

  .label { font-size: 11.5pt; font-weight: 700; margin: 9px 0 1px; }
  .label span { font-weight: 400; font-size: 10pt; color: var(--muted); }

  .row { display: block; width: 100%; height: auto; margin-bottom: .06in; }
  /* Rows that follow the header directly would otherwise jam against its rule. */
  header + .row { margin-top: .12in; }

  .words {
    margin-top: 10px; padding-top: 7px; border-top: 1px solid var(--rule);
    font-size: 12.5pt;
    display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
  }
  .words b { font-size: 14pt; }
  .words em { font-style: normal; color: var(--muted); }

  /* The wordmark rides in the footer line that was already there — see the note
     in lib/sheet.js. No height, upright, a size down, and never louder than the
     two slots it sits between. */
  .brand { font-style: normal; font-size: 7pt; letter-spacing: .04em;
    color: var(--accent); align-self: center; }

  footer {
    margin-top: 7px; font-size: 8.5pt; color: var(--muted);
    display: flex; justify-content: space-between;
  }

  .chart { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; margin-top: 14px; }
  .cell {
    border: 2px solid var(--slate); border-radius: 8px; height: 1.35in;
    display: flex; align-items: center; justify-content: center;
  }

  .page.key { background: #fcfcfa; }
  .page.key header { border-bottom-style: double; border-bottom-width: 3px; }
  .keylist { font-size: 11pt; line-height: 1.7; }
  .keylist p { margin: .02in 0; }
  .keynote { border: 1.5px solid var(--deep); border-radius: 8px; padding: .07in .12in;
    margin: .1in 0 0; font-size: 10pt; line-height: 1.5; }

  .note { border: 1.5px solid var(--deep); border-radius: 8px; padding: .07in .12in;
    margin: .06in 0 .12in; font-size: 10pt; color: var(--ink); }
  .tasknote { border: 1.5px solid var(--deep); border-radius: 8px; padding: .07in .12in;
    margin: .12in 0 0; font-size: 10.5pt; }
  svg { display: block; }
  svg.inline { display: inline-block; vertical-align: middle; }

  .brow { display: flex; align-items: center; gap: .2in;
    border-bottom: 1px solid var(--rule); padding: .08in 0; }
  /* At u:7 a ones-cube is seven pixels across and nine of them next to nine
     tens-bars is a gray smudge. Eleven is the smallest that a six-year-old can
     actually count without leaning in. */
  /*
   * THE PICTURE TAKES THE WIDTH IT NEEDS. This was a fixed 3.2in column, and
   * the drawings are sized by how many blocks are in them, so the wide ones ran
   * 85pt past the column and under the answer boxes. A fixed column for a
   * variable-width drawing is a collision waiting for the right number.
   *
   * Now the picture is its own size and the slots take what is left, with a
   * minimum so they never get squeezed into a stack.
   */
  .bpic { flex: 0 1 auto; min-width: 0; }
  /*
   * THE SLOTS ARE CAPPED SO THEY WRAP. Left to run in one line they took 3in
   * of a 7.6in page for three boxes and four words, and the drawing — the part
   * being read — got what was left. Capped, "so the number is" drops onto a
   * second line under the two boxes, the group occupies about 1.9in, and the
   * blocks get the rest.
   */
  .bslots { flex: 0 0 auto; margin-left: auto; max-width: 2.2in; justify-content: flex-end; }
  .bslots { display: flex; align-items: center; gap: .1in; flex-wrap: wrap; }
  .bslot { display: flex; flex-direction: column; align-items: center; gap: .02in; }
  .bslot span { font-size: 11pt; color: var(--muted); }
  .bbox { width: .62in; height: .6in; border: 2px solid var(--slate); border-radius: 5px; }
  .bbox.wide { width: .95in; }
  .bis { font-size: 12pt; color: var(--ink); padding: 0 .04in; }

  .crow { display: flex; align-items: center; gap: .1in;
    border-bottom: 1px solid var(--rule); padding: .12in 0; }
  .cnum { flex: 0 0 1.2in; }
  .cis, .cw { font-size: 16pt; }
  .cbox { width: .7in; height: .62in; border: 2px solid var(--slate); border-radius: 5px; }

  .strip { display: grid; grid-template-columns: repeat(10, 1fr); gap: .04in;
    margin-bottom: .14in; }
  .scell { border: 1.4px solid var(--ink); border-radius: 4px; height: .9in;
    display: flex; align-items: center; justify-content: center; }
  .scell.blank { border-color: var(--ink); border-width: 2px; }

  .nextrow { margin-top: .4in; }
  .nlabel { font-size: 14pt; font-weight: 700; margin-bottom: .14in; }
  .nitem { display: inline-flex; align-items: center; gap: .1in; margin: 0 .4in .24in 0; }
  .nitem span { font-size: 20pt; }
  .nbox { width: .95in; height: .75in; border: 2px solid var(--slate); border-radius: 5px; }

  .prow { display: flex; align-items: center; gap: .16in;
    border-bottom: 1px solid var(--rule); padding: .14in 0; }
  .ppic { flex: 0 0 3.2in; }
  .peq { display: flex; align-items: center; gap: .09in; margin-left: auto; }
  .peq span { font-size: 24pt; font-weight: 700; }
  .pbox { width: .95in; height: .75in; border: 2.4px solid var(--slate); border-radius: 5px; }
</style>
</head>
